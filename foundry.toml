[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "script"
out = "out"
libs = ["contracts/lib", "singleton-paymaster/lib"]
cache_path = "cache"
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 500
via_ir = true
evm_version = "cancun"
# Always emit storage layout so the UUPS storage-drift guard
# (scripts/check_storage_layout.py) can read it from artifacts.
extra_output = ["storageLayout"]
# Strip CBOR metadata from deployed bytecode so that codehash reflects only
# logic changes. Without this, ANY source-file edit (tests, unrelated contracts)
# changes the metadata suffix and makes UpgradeLive.s.sol think an upgrade is
# needed even when SP/Registry logic is identical.
bytecode_hash = "none"

# Include singleton-paymaster libs but exclude tests to avoid conflicts
# Also exclude old test location to prevent duplicates
# exclude = ["singleton-paymaster/test/**/*", "singleton-paymaster/**/*.t.sol"]

# Remappings for dependencies
remappings = [
    "@openzeppelin/contracts/=singleton-paymaster/lib/openzeppelin-contracts-v5.0.2/contracts/",
    "@openzeppelin-v5.0.2/=singleton-paymaster/lib/openzeppelin-contracts-v5.0.2/",
    "@account-abstraction-v7/=singleton-paymaster/lib/account-abstraction-v7/contracts/",
    "@chainlink/contracts/=contracts/lib/chainlink-brownie-contracts/contracts/",
    "solady/=contracts/lib/solady/src/",
    "singleton-paymaster/=singleton-paymaster/",
    "src/=contracts/src/"
]

# Allow writing deployment info
fs_permissions = [{ access = "read-write", path = "./contracts/deployments" }, { access = "read-write", path = "./script" }, { access = "read-write", path = "./" }, { access = "read-write", path = "./script/v3" }]

# ============================================
# V3-Only Profile (Fast Build for Deployment)
# ============================================
# Usage: forge build --profile v3-only
# This profile only compiles V3 core contracts, excluding legacy versions and test contracts
[profile.v3-only]
src = "contracts/src"
test = "contracts/test"
script = "script"
out = "out"
libs = ["contracts/lib", "singleton-paymaster/lib"]
cache_path = "cache"
solc_version = "0.8.33"
# Must match profile.default. Two pre-existing bugs made this profile unusable:
#   - via_ir = false put GTokenStaking.sol over "Stack too deep", so the WHOLE
#     profile failed to compile — `forge build --profile v3-only` (documented in
#     CLAUDE.md) had not produced an artifact in a long time.
#   - optimizer_runs = 10000 builds SuperPaymaster at 27,597 and BLSAggregator at
#     25,860 bytes, i.e. both OVER the 24,576 EIP-170 limit and undeployable.
# Fixing only the first would have swapped a loud failure for a silent oversize,
# so the optimizer settings are aligned with the profile that actually ships.
optimizer = true
optimizer_runs = 500
via_ir = true
evm_version = "cancun"

# Exclude all non-V3 contracts
# skip = [
#     "contracts/src/paymasters/v1/**/*",
#     "contracts/src/paymasters/v2/**/*",
#     "contracts/src/paymasters/superpaymaster/v1/**/*",
#     "contracts/src/paymasters/superpaymaster/v2/**/*",
#     "contracts/src/paymasters/PaymasterFactory.sol",
#     "contracts/src/base/Registry_v1.sol",
#     "contracts/src/history/**/*",
#     "script/**/*",
#     "contracts/src/test/**/*",
#     "contracts/src/mocks/**/*",
#     "singleton-paymaster/test/**/*",
#     "singleton-paymaster/**/*.t.sol"
# ]

remappings = [
    "@openzeppelin-v5.0.2/=singleton-paymaster/lib/openzeppelin-contracts-v5.0.2/",
    "@account-abstraction-v7/=singleton-paymaster/lib/account-abstraction-v7/contracts/",
    "@chainlink/contracts/=contracts/lib/chainlink-brownie-contracts/contracts/",
    "solady/=contracts/lib/solady/src/",
    "src/=contracts/src/"
]

fs_permissions = [{ access = "read-write", path = "./contracts/deployments" }, { access = "read-write", path = "./script" }, { access = "read-write", path = "./" }, { access = "read-write", path = "./script/v3" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# ============================================
# Tokens-only profile (skips paper7 scratch dir)
# ============================================
# Usage: forge test --profile tokens
[profile.tokens]
src = "contracts/src"
test = "contracts/test/tokens"
out = "out"
libs = ["contracts/lib", "singleton-paymaster/lib"]
cache_path = "cache"
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 10000
via_ir = true
evm_version = "cancun"
remappings = [
    "@openzeppelin-v5.0.2/=singleton-paymaster/lib/openzeppelin-contracts-v5.0.2/",
    "@account-abstraction-v7/=singleton-paymaster/lib/account-abstraction-v7/contracts/",
    "@chainlink/contracts/=contracts/lib/chainlink-brownie-contracts/contracts/",
    "solady/=contracts/lib/solady/src/",
    "src/=contracts/src/"
]

# ============================================
# Property-based testing config (audit §6 T-H2)
# ============================================
# Top-level [fuzz]/[invariant] tables apply to the default profile. They give
# the new invariant suite (contracts/test/invariant/) enough breadth without a
# CLI override. CI can still pass --fuzz-runs / --invariant-runs to scale up.
[fuzz]
runs = 256

[invariant]
runs = 256              # independent invariant campaigns per test
depth = 500             # handler calls per run
fail_on_revert = false  # handlers intentionally swallow expected reverts
                        # (bound() guards, rate cooldowns, replay rejections)

# ============================================
# Registry size profile (CC-48 / EIP-170)
# ============================================
# Registry is the contract closest to the 24,576-byte EIP-170 ceiling. Compiling
# just this file at a lower optimizer_runs buys real deployment headroom while
# leaving SuperPaymaster's ERC-4337 validation path (the gas-sensitive one)
# untouched. This is a stopgap, not the fix: the credit/reputation subsystem
# still has to be split out of Registry before it grows again.
[[profile.default.additional_compiler_profiles]]
name = "registry-size"
optimizer_runs = 200
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "contracts/src/core/Registry.sol"
max_optimizer_runs = 200

# Same restriction for the v3-only deployment profile, so `--profile v3-only`
# cannot silently rebuild Registry at runs=10000 and blow past EIP-170.
[[profile.v3-only.additional_compiler_profiles]]
name = "registry-size"
optimizer_runs = 200
via_ir = true

[[profile.v3-only.compilation_restrictions]]
paths = "contracts/src/core/Registry.sol"
max_optimizer_runs = 200
