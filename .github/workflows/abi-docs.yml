name: ABI Docs Drift

# Regenerates the ABI reference from compiled artifacts and fails if the committed
# docs/abi/ are stale. Runs whenever the contract surface, the generator, the docs,
# or the package manifest changes — independent of the Solidity test workflow (which
# skips docs-only PRs).
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'contracts/src/**'
      - 'scripts/gen-abi-docs.mjs'
      - 'abis/**'
      - 'scripts/check-abi-bundle.mjs'
      - 'scripts/gen-sp-full-abi.py'
      - 'scripts/resolve_default_artifact.py'
      - 'scripts/test_resolve_default_artifact.py'
      - 'scripts/extract_v3_abis.sh'
      - 'foundry.toml'
      - 'contracts/script/**'
      - 'singleton-paymaster'
      - 'docs/abi/**'
      - 'abis/**'
      - 'scripts/check-abi-bundle.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/abi-docs.yml'
  pull_request:
    paths:
      - 'contracts/src/**'
      - 'scripts/gen-abi-docs.mjs'
      - 'docs/abi/**'
      - 'abis/**'
      - 'scripts/check-abi-bundle.mjs'
      - 'scripts/gen-sp-full-abi.py'
      - 'scripts/resolve_default_artifact.py'
      - 'scripts/test_resolve_default_artifact.py'
      - 'scripts/extract_v3_abis.sh'
      - 'foundry.toml'
      - 'contracts/script/**'
      - 'singleton-paymaster'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/abi-docs.yml'

jobs:
  abi-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }   # same pin as security.yml; the resolver compares bytecode

      # A plain build, as deploy-core runs it: `--skip test` never compiles the deploy
      # scripts' closure, so TimelockController (deployed by DeployAPNTsCapped) had no
      # profile.default artifact at all and its exported bytecode went unchecked.
      - name: forge build (produces out/ artifacts)
        run: forge build

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify ABI docs are up to date (pnpm gen:abi-docs:check)
        run: pnpm gen:abi-docs:check

      # gen:abi-docs:check only recomputes docs/abi/*.md. It never reads
      # abis/*.json -- the bundle sync_to_sdk.sh copies into aastar-sdk. That is
      # how abis/BLSAggregator.json drifted four functions behind the contract
      # for six days with this job green (#410, #411).
      # check-abi-bundle and extract_v3_abis.sh pick artifacts through this resolver
      # (the same profile.default rule the deploy scripts use); its own cases first.
      - name: Artifact resolver self-test
        run: python3 -B scripts/test_resolve_default_artifact.py

      - name: ABI bundles match the compiled contracts
        run: node scripts/check-abi-bundle.mjs
