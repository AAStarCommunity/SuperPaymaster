name: ABI Docs Drift

# Regenerates the ABI reference from compiled artifacts and fails if the committed
# docs/abi/ are stale. Runs whenever the contract surface, the generator, the docs,
# or the package manifest changes — independent of the Solidity test workflow (which
# skips docs-only PRs).
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'contracts/src/**'
      - 'scripts/gen-abi-docs.mjs'
      - 'abis/**'
      - 'scripts/check-abi-bundle.mjs'
      - 'docs/abi/**'
      - 'abis/**'
      - 'scripts/check-abi-bundle.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/abi-docs.yml'
  pull_request:
    paths:
      - 'contracts/src/**'
      - 'scripts/gen-abi-docs.mjs'
      - 'docs/abi/**'
      - 'abis/**'
      - 'scripts/check-abi-bundle.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/abi-docs.yml'

jobs:
  abi-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: forge build (produces out/ artifacts)
        run: forge build --skip test

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify ABI docs are up to date (pnpm gen:abi-docs:check)
        run: pnpm gen:abi-docs:check

      # gen:abi-docs:check only recomputes docs/abi/*.md. It never reads
      # abis/*.json -- the bundle sync_to_sdk.sh copies into aastar-sdk. That is
      # how abis/BLSAggregator.json drifted four functions behind the contract
      # for six days with this job green (#410, #411).
      - name: ABI bundles match the compiled contracts
        run: node scripts/check-abi-bundle.mjs
