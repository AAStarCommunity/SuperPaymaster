name: a3a-executor
# Offline tests of script/a3a/a3a_exec.py and the live sender script/a3a/a3a_send.py (mocked RPC; no network,
# no keys: the sender tests sign with the public anvil test key through a cast wrapper).
# The tests use `cast` only for ABI encoding / keccak, which is identical across foundry versions;
# the executor itself still pins and verifies the Amsterdam engine commit at fork start.
on:
  pull_request:
    paths:
      - 'script/a3a/**'
      - 'script/upgrade/**'
      - 'script/evidence/**'
      - 'script/a6-collector/**'
      - 'docs/design/aoa-balance-mode/data/a6-gauge-credit/**'
      - '.github/workflows/a3a-executor.yml'
  push:
    branches: [main]
    paths:
      - 'script/a3a/**'
      - 'script/upgrade/**'
      - 'script/evidence/**'
      - 'script/a6-collector/**'
      - 'docs/design/aoa-balance-mode/data/a6-gauge-credit/**'
      - '.github/workflows/a3a-executor.yml'
permissions:
  contents: read
jobs:
  a3a-executor-tests:
    name: a3a-executor-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Foundry (same pin as test.yml)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Offline executor tests
        run: |
          A3A_ENGINE_DIR="$(dirname "$(command -v cast)")" python3 -B script/a3a/test_a3a_exec.py
      - name: Offline A3a live-sender tests (real cast signing with the public anvil key; no network)
        run: |
          A3A_ENGINE_DIR="$(dirname "$(command -v cast)")" python3 -B script/a3a/test_a3a_send.py </dev/null
      - name: Offline Safe A6e upgrade executor tests
        run: |
          A3A_ENGINE_DIR="$(dirname "$(command -v cast)")" python3 -B script/upgrade/test_sp_upgrade_exec.py
      - name: Offline pre-sampling manifest tests
        run: |
          A3A_ENGINE_DIR="$(dirname "$(command -v cast)")" python3 -B script/upgrade/test_manifest_exec.py
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install collector validator dependencies (pinned by pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: A4 fixed-block evidence and truncation controls
        run: |
          python3 -B script/evidence/test_a4_credit_logscan.py
          python3 -B script/evidence/test_a4_state_check.py
          python3 -B script/evidence/test_a4_a6_controls.py
          python3 -B script/evidence/test_a4_anvil_control.py
          A3A_ENGINE_DIR="$(dirname "$(command -v cast)")" python3 -B script/evidence/test_a4_mutations.py
      - name: Preserve A4 control records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-checker-control-records
          path: |
            script/evidence/a4-anvil-control-result.json
            script/evidence/a4-guard-mutations.json
