name: Evidence verifiers

on:
  pull_request:
    paths:
      - 'script/evidence/**'
      - 'docs/design/aoa-balance-mode/data/**'
      - '.github/workflows/evidence-verifiers.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # RR5 release/historical verification reads the recorded measurement commits.
          fetch-depth: 0
          submodules: recursive

      # test_a4_mutations imports script/upgrade/test_manifest_exec, which reads the archived L-1
      # Registry build from /private/tmp/l1-builds; materialize it as a3a-executor.yml does.
      - name: Materialize the L-1 Registry test fixture (CI has no local archive)
        run: |
          sudo mkdir -p /private/tmp/l1-builds && sudo chown "$USER" /private/tmp/l1-builds
          cd script/upgrade && python3 -B -c "import pathlib, l1_registry_fixture as f; d = pathlib.Path('/private/tmp/l1-builds')/f.COMMIT; d.mkdir(exist_ok=True); f.materialize_fixture(d); print('materialized', d)"

      - name: Install jsonschema (manifest tests import its fixtures)
        run: python3 -m pip install --quiet --break-system-packages 'jsonschema==4.23.0'

      # test_a4_state_check.py and test_a4_mutations.py use cast only for local ABI hashing.
      - name: Install Foundry CLI
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1
        with: { version: v1.7.1 }   # same pin as a3a-executor.yml and security.yml

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node dependencies for offline fixture validators
        run: pnpm install --frozen-lockfile

      - name: RR5 historical evidence and release rejection controls
        run: python3 script/evidence/test_rr5_lifecycle_verify.py

      - name: Other offline evidence verifier suites
        run: |
          # a3a_exec.py defaults ENGINE to a local pinned-nightly path that a runner does not have;
          # point it at the installed cast/anvil, as a3a-executor.yml does.
          export A3A_ENGINE_DIR="$(dirname "$(command -v cast)")"
          python3 script/evidence/test_a3a_funding_provenance.py
          python3 script/evidence/test_a3a_newpin_senders_reread.py
          python3 script/evidence/test_a3a_v4_reread.py
          python3 script/evidence/test_a4_a6_controls.py
          python3 script/evidence/test_a4_credit_logscan.py
          python3 script/evidence/test_a4_state_check.py
          python3 script/evidence/test_a4_mutations.py
          python3 script/evidence/test_q5_snapshot_timestamp.py
          python3 script/evidence/test_floor_margin_run.py
          python3 script/evidence/test_floor_margin_extract.py
          python3 script/evidence/test_test_exec_inventory.py
          python3 script/evidence/test_executed_runners.py
          python3 script/evidence/test_url_free.py
          python3 script/evidence/test_rams_capture.py
          python3 script/evidence/test_rams_gauges.py
          python3 script/evidence/test_w2_op_mainnet_exposure.py

      # Excluded: test_a4_anvil_control.py starts a local chain and may download solc.
      - name: Mutation artifact remains deterministic
        run: git diff --exit-code -- script/evidence/a4-guard-mutations.json
