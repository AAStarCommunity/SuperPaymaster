name: a7-readback-schema

on:
  pull_request:
    paths:
      - 'docs/release/a7/**'
      - '.github/workflows/a7-readback-schema.yml'
  push:
    branches: [main]
    paths:
      - 'docs/release/a7/**'

permissions:
  contents: read

jobs:
  schema-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Both examples validate, negatives are rejected, no oneOf overlaps
        run: python docs/release/a7/validate_readback_schema.py
