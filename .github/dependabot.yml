# Dependabot configuration for SuperPaymaster
# This file configures GitHub Dependabot to manage dependency updates
# and security alerts for the project
#
# NOTE: Git submodules (singleton-paymaster/, contracts/lib/, lib/) contain
# upstream dependencies (OpenZeppelin, Pimlico, eth-infinitism, Chainlink).
# Their internal npm dependencies should NOT be updated here — they are pinned
# to specific upstream commits. Only monitor our own root-level dependencies.
#
# If Dependabot still opens PRs for vendored submodule package.json files
# (e.g. singleton-paymaster/lib/**), these are transitive deps of upstream
# tests/docs tooling that we never install, execute, or bundle. Close them.
#
# MEASURED, 2026-08-29 — why the exclusions below do not stop them, so the next
# person does not re-derive it. The `!/singleton-paymaster/**` entries landed in
# f23bd432 on 2026-04-26. Eight such PRs were nevertheless opened between
# 2026-07-20 and 2026-08-09 (#355/356/357/358/360/361/365/367, all closed on
# 2026-08-29). Three months after the exclusion is not a config that "has not
# taken effect yet": these are SECURITY-ALERT driven updates, which are not
# scoped by the `directories` list of an `updates` entry. The same explains the
# `ignore` list below not suppressing them — axios and brace-expansion are both
# ignored here and both still produced PRs.
#
# So the exclusions govern version updates only, and closing remains the standing
# action for security updates under vendored paths.
#
# WHY DEPENDABOT CAN SEE INSIDE singleton-paymaster AT ALL, and what remediation
# therefore looks like. .gitmodules DECLARES singleton-paymaster as a submodule,
# but the index does not agree, and the index is what Dependabot walks:
#
#   git ls-files -s singleton-paymaster | awk '{print $1}' | sort | uniq -c
#     -> 2423 x 100644 + 73 x 100755, and ZERO 100000-series gitlinks
#   git ls-files -s contracts/lib/solady  -> a single 160000 gitlink
#   git submodule status                  -> 6 entries; singleton-paymaster absent
#
# The load-bearing fact is the ABSENCE of a 160000 entry, not the presence of any
# particular blob mode: `git ls-files -s <path> | awk '$1=="160000"'` is the check.
# (An earlier version of this note said "mode 100644, 2496 ordinary files" — that
# mode came from the first row and was asserted over all 2496; 73 of them are
# 100755 executables. The conclusion is unchanged, the summary was not.)
#
# The real submodules are gitlinks, so Dependabot sees one opaque commit id and
# cannot scan inside them. singleton-paymaster is committed as ordinary files, so
# every lockfile in its vendored lib/ tree is, to Dependabot, a manifest in THIS
# repository. That is the mechanism, and no `directories` rule changes it.
#
# It also means there is NO SUBMODULE POINTER TO BUMP here — an earlier version of
# this note prescribed exactly that, which is not an action anyone can take. If a
# vulnerability in one of those trees ever genuinely reaches our build, the options
# are: re-vendor the affected files from upstream in a normal commit, or convert
# singleton-paymaster into a real submodule so .gitmodules and the index agree
# (a large change, and out of scope for a dependency bump).
#
# Note the premise is still almost always false: our build is Foundry over .sol,
# and nothing in those JS trees is installed, executed or bundled.

version: 2
updates:
  # Monitor npm dependencies in the root project + packages/* workspaces ONLY.
  # Explicitly exclude vendored submodule paths so transitive deps of their
  # own test/docs tooling don't generate PR noise here.
  - package-ecosystem: "npm"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    # Limit is shared across the whole npm ecosystem, not per-directory.
    # We monitor 4 directories (/, /packages/*, /subgraph, /script/gasless-tests),
    # so a value of 1 lets a single stuck PR block updates for every other dir.
    # 5 = one slot per directory + 1 buffer for a stale cross-week PR.
    open-pull-requests-limit: 5
    directories:
      - "/"
      - "/packages/*"
      - "/subgraph"
      - "/script/gasless-tests"
      - "!/singleton-paymaster/**"
      - "!/contracts/lib/**"
      - "!/lib/**"
      - "!/standards/**"
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "@sentry/node"
      - dependency-name: "axios"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "cookie"
      - dependency-name: "brace-expansion"
      - dependency-name: "@eslint/plugin-kit"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
