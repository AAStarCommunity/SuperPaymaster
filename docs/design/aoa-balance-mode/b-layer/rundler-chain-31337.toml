# D5 gate G1: Rundler v0.11.0 chain spec for the local B-layer anvil (--hardfork osaka, chain 31337).
# Identical to the built-in `dev` spec (bin/rundler/chain_specs/dev.toml: base = "ethereum",
# 250 ms bundle interval, 30M block gas limit) except the chain id, so Rundler and Alto run
# against ONE chain (31337). (`base = "dev"` is refused by Rundler: a base may not itself have a base.)
base = "ethereum"
name = "B-layer anvil (Osaka)"
id = 31337

bundle_max_send_interval_millis = 250
block_gas_limit = 30000000
