# .pilot.yml — pilot skill 的仓库级配置。脚本不解析 YAML；skill 读取后作为 flag 传给脚本。

# ── 单主干仓库 ──────────────────────────────────────────────────────────────
# SuperPaymaster 没有集成分支：所有 PR 直接开向 main，合并后 main 即发布基线。
# 因此 integration_branch == base_branch 是【刻意配置，不是缺失】——
# 不要为了迎合 pilot 的默认值去建一个 preview 分支。
# 合并时用: git-guard.sh merge-pr <n> --integration main --allow-trunk
# --allow-trunk 不是绕过:它仍要求 main 的 GitHub 分支保护要求审批、且该 PR 已 APPROVED,
# 读不到保护规则就 fail-closed 拒绝。
base_branch: main
integration_branch: main

# ── protect_patterns 是【惰性数据,不是生效的保护】 ────────────────────────────
# 没有任何东西会自动读这个键。safe-cleanup.sh 不解析 YAML,它只认命令行上的
#   --protect "release,hotfix,deploy"
# 也就是说:这几行保护的是「操作者记得把它翻译成 flag」这件事,不是分支本身。
#
# 更要命的是它失败的方向。脚本【内置】的默认保护列表是(safe-cleanup.sh:69):
#   main,master,develop,preview,integration,release,hotfix
# release 和 hotfix 已经在里面了 —— 所以这三行里【只有 deploy 真正改变行为】,
# 而它恰好也是忘记加 flag 时唯一会静默失去保护的那个。写了 deploy 却不传 flag,
# 读起来像「已保护」,实际等于没写。
#
# 因此清理【一律】用这一整行,不要省掉 --protect:
#   bash ~/.claude/skills/pilot/scripts/safe-cleanup.sh \
#     --integration main --protect "release,hotfix,deploy" [--squash-merged] [--apply]
#
# 2026-09-06 用配对对照实测过 --protect 这条路径确实通(两栏都要看,只看一栏区分不了
# 「保护生效」和「量具死了」):
#   不传 --protect → `would delete deploy/canary-probe`   (阴性对照:量具活着)
#   传  --protect → deploy/canary-probe 从清单里消失,     (阳性对照:保护真的生效)
#                   而 probe/deploy-canary 仍被列出        (边界正确:deploy 是前缀不是子串)
#
# 还有一个绕过口子,记在这里因为它咬过一次:直接敲 `git branch -D` 完全不经过
# is_protected。2026-09-06 清理 51 个 squash-merged 分支时我就是这么删的 —— 那次没
# 碰到 deploy/*,但那是运气,不是保证。批量删走脚本,别自己写循环。
#
# deploy/* 是链上部署演习分支:它们钉住的是部署当时的树,main 里重建不出来。
# (2026-09-06 现状:本仓库 local 和 remote 都已没有 deploy/* 分支。)
protect_patterns:
  - release
  - hotfix
  - deploy

remote: origin

# ── 远程分支清理 ────────────────────────────────────────────────────────────
# 仓库已开启 GitHub auto-delete-on-merge(2026-09-06 核实: delete_branch_on_merge=true),
# 合并即由服务端删除远程 head 分支。pilot 的脚本【完全不碰远程分支】,这是刻意的:
# 从 clone 判断远程分支是否已合并要靠可能过期的 remote-tracking ref。
# 已知两类残留【不是设置失效】:
#   1) 合并后又往同名分支 push 了新 commit → 分支被重新创建(如 #379 的 head)
#   2) PR 是 closed 而非 merged → auto-delete 不触发(如 #409 的 head)
# 这两类都要人工判断,因为它们含未进 main 的 commit。

docs_dir: docs/agent

# ── 规划在哪里 ──────────────────────────────────────────────────────────────
# external = 规划不在 docs_dir 的七件套里,而在 GitHub issues + Seeder 协同中枢(狗头/DSR 流程)。
# 起跑门禁会打印「source=external — NOTHING WAS CHECKED」并放行:
# 【它没有检查任何东西】。这是一句人做的担保,不是脚本核实的结论——
# 汇报时必须照实说「本仓库声明规划在别处、门禁未核实」,不能说成「规划已验证」。
planning_source: external
