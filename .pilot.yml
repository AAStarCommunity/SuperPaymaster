# .pilot.yml — pilot skill 的仓库级配置。脚本不解析 YAML；skill 读取后作为 flag 传给脚本。

# ── 单主干仓库 ──────────────────────────────────────────────────────────────
# SuperPaymaster 没有集成分支：所有 PR 直接开向 main，合并后 main 即发布基线。
# 因此 integration_branch == base_branch 是【刻意配置，不是缺失】——
# 不要为了迎合 pilot 的默认值去建一个 preview 分支。
# 合并时用: git-guard.sh merge-pr <n> --integration main --allow-trunk
# --allow-trunk 不是绕过:它仍要求 main 的 GitHub 分支保护要求审批、且该 PR 已 APPROVED,
# 读不到保护规则就 fail-closed 拒绝。
base_branch: main
integration_branch: main

# ── protect_patterns：由 git hook 在 ref 层机械强制 ─────────────────────────
# 这些前缀由 .githooks/reference-transaction 强制,不是靠注释、也不是靠记得加 flag。
# 安装:  bash scripts/install-git-hooks.sh   (装进 core.hooksPath 指向的目录,不改指针)
#
# 为什么必须放在 ref 层,而不是靠 safe-cleanup.sh 的 --protect:
#   --protect 只在操作者【手敲了那个 flag】时才生效,它保护的是「记得」,不是分支;
#   而且脚本内置默认已含 release/hotfix,唯独不含 deploy —— 所以三条里只有 deploy
#   真正改变行为,也就只有它会在忘记 flag 时静默失去保护,读起来还像「已保护」。
#   2026-09-06 清理 51 个分支时用的是裸 `git branch -D` 循环,它根本不经过 --protect
#   那条路径。ref 层是所有删除路径的汇合处:branch -d/-D、update-ref -d、脚本、IDE、
#   还没写出来的工具,全都要过。那里【没有 flag 可忘,因为没有 flag】。
#
# fail-closed:配置缺失/解析不出来时回落到硬编码 release,hotfix,deploy,而不是放行。
# 逃生舱(每次显式、无法靠遗忘触发): PILOT_ALLOW_PROTECTED_DELETE=1 git branch -D <b>
#
# 2026-09-06 实测(每条都要两栏,单栏分不开「生效」和「量具死了」):
#   deploy/probe-a 删除        → BLOCKED,分支仍在      | probe/deploy-lookalike → 正常删除
#     (前缀按路径段匹配,deploy 不保护 probe/deploy-canary 这种子串命中)
#   配置里加 zzdiscriminator   → BLOCKED               | 藏掉配置后同一条 → 正常删除
#     (判别值只存在于配置、不在 fallback 里,才能证明是【解析】在工作而不是 fallback 顶包)
#   fetch --prune / refs/remotes 删除 / tag 删除 / 分支创建 / switch → 全部不受影响
#     (只拦 refs/heads 的删除:创建是 old=zeros&new=sha,所以判据只看 new,绝不能看 old)
#
# deploy/* 钉住的是链上部署当时的树,main 里重建不出来。
# (2026-09-06 现状:本仓库 local/remote 都已无 deploy/* 分支;这条规则是留给下一个的。)
protect_patterns:
  - release
  - hotfix
  - deploy

remote: origin

# ── 远程分支清理 ────────────────────────────────────────────────────────────
# 仓库已开启 GitHub auto-delete-on-merge(2026-09-06 核实: delete_branch_on_merge=true),
# 合并即由服务端删除远程 head 分支。pilot 的脚本【完全不碰远程分支】,这是刻意的:
# 从 clone 判断远程分支是否已合并要靠可能过期的 remote-tracking ref。
# 已知两类残留【不是设置失效】:
#   1) 合并后又往同名分支 push 了新 commit → 分支被重新创建(如 #379 的 head)
#   2) PR 是 closed 而非 merged → auto-delete 不触发(如 #409 的 head)
# 这两类都要人工判断,因为它们含未进 main 的 commit。

docs_dir: docs/agent

# ── 规划在哪里 ──────────────────────────────────────────────────────────────
# external = 规划不在 docs_dir 的七件套里,而在 GitHub issues + Seeder 协同中枢(狗头/DSR 流程)。
# 起跑门禁会打印「source=external — NOTHING WAS CHECKED」并放行:
# 【它没有检查任何东西】。这是一句人做的担保,不是脚本核实的结论——
# 汇报时必须照实说「本仓库声明规划在别处、门禁未核实」,不能说成「规划已验证」。
planning_source: external
